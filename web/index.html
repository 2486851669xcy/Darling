<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DimensionMessenger Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="phone-frame">
        <button id="notificationToast" class="notification-toast" type="button" aria-live="polite">
          <img id="notificationAvatar" class="notification-avatar" alt="" />
          <span class="notification-copy">
            <span id="notificationTitle" class="notification-title"></span>
            <span id="notificationBody" class="notification-body"></span>
          </span>
        </button>

        <header class="app-header">
          <button id="backBtn" class="back-button hidden" type="button">‹</button>
          <div class="header-copy">
            <div class="chat-title">消息</div>
            <div class="chat-subtitle">DimensionMessenger</div>
          </div>
          <button id="clearBtn" class="ghost-button hidden" type="button">清空记录</button>
        </header>

        <main id="messagesView" class="app-view active-view">
          <section class="conversation-list">
            <button id="maiConversation" class="conversation-card" type="button">
              <img class="conversation-avatar" alt="樱岛麻衣头像" />
              <span class="conversation-main">
                <span class="conversation-name">樱岛麻衣</span>
                <span id="conversationPreview" class="conversation-preview">点开和她聊天</span>
              </span>
              <span id="conversationTime" class="conversation-time"></span>
            </button>
          </section>
        </main>

        <main id="contactsView" class="app-view">
          <section class="wechat-list contact-actions">
            <button class="wechat-row" type="button">
              <span class="wechat-icon orange">＋</span>
              <span class="wechat-label">新的朋友</span>
            </button>
            <button class="wechat-row" type="button">
              <span class="wechat-icon green">群</span>
              <span class="wechat-label">群聊</span>
            </button>
            <button class="wechat-row" type="button">
              <span class="wechat-icon blue">签</span>
              <span class="wechat-label">标签</span>
            </button>
          </section>
          <section class="section-title">星标朋友</section>
          <button id="maiContact" class="contact-row" type="button">
            <img class="contact-avatar" alt="樱岛麻衣头像" />
            <span>
              <span class="contact-name">樱岛麻衣</span>
              <span class="contact-note">恋人</span>
            </span>
          </button>
          <section class="section-title">M</section>
          <button class="contact-row muted-row" type="button">
            <span class="contact-avatar placeholder-avatar">M</span>
            <span>
              <span class="contact-name">Mai Sakurajima</span>
              <span class="contact-note">同一位联系人</span>
            </span>
          </button>
        </main>

        <main id="momentsView" class="app-view moments-view">
          <section class="moments-cover">
            <div class="moments-cover-copy">
              <div class="moments-title">我</div>
              <img class="moment-avatar moments-self-avatar" alt="我的头像" />
            </div>
          </section>
          <section class="moment-composer">
            <textarea id="momentInput" maxlength="280" placeholder="这一刻的想法..."></textarea>
            <button id="postMomentBtn" type="button">发表</button>
          </section>
          <div id="momentStatus" class="moment-status hidden"></div>
          <section id="momentsList" class="moments-list"></section>
        </main>

        <main id="profileView" class="app-view profile-view">
          <section class="profile-card">
            <img class="profile-avatar" alt="我的头像" />
            <div class="profile-main">
              <div class="profile-name">我</div>
              <div class="profile-id">微信号：local-user</div>
            </div>
            <span class="profile-qr">▣</span>
          </section>
          <section class="wechat-login-section" aria-labelledby="wechatLoginHeading">
            <h2 id="wechatLoginHeading" class="wechat-login-heading">账号与登录</h2>
            <button
              id="wechatLoginBtn"
              class="wechat-login-row is-checking"
              type="button"
              aria-label="微信扫码登录状态正在检查"
              aria-describedby="wechatLoginDetail wechatLoginFeedback"
              disabled
            >
              <span id="wechatLoginIcon" class="wechat-login-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M4 4h6v6H4V4Zm2 2v2h2V6H6Zm8-2h6v6h-6V4Zm2 2v2h2V6h-2ZM4 14h6v6H4v-6Zm2 2v2h2v-2H6Zm8-2h2v2h-2v-2Zm4 0h2v4h-2v-4Zm-4 4h4v2h-4v-2Z" />
                </svg>
              </span>
              <img id="wechatUserAvatar" class="wechat-user-avatar" alt="" width="40" height="40" referrerpolicy="no-referrer" hidden />
              <span class="wechat-login-copy">
                <strong id="wechatLoginTitle">微信扫码登录</strong>
                <span id="wechatLoginDetail">正在检查登录配置…</span>
              </span>
              <span id="wechatLoginStatus" class="wechat-login-status">检查中</span>
            </button>
            <div id="wechatAccountActions" class="wechat-account-actions" hidden>
              <button id="wechatLogoutBtn" class="wechat-logout-button" type="button" aria-label="退出微信登录" aria-describedby="wechatLoginFeedback">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M9 12h9" />
                </svg>
                <span id="wechatLogoutLabel">退出微信登录</span>
              </button>
            </div>
            <p id="wechatLoginFeedback" class="wechat-login-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
          </section>
          <section class="settings-list wechat-list">
            <button class="wechat-row" type="button">
              <span class="wechat-icon green">服</span>
              <span class="wechat-label">服务</span>
            </button>
          </section>
          <section class="settings-list wechat-list">
            <button class="wechat-row" type="button">
              <span class="wechat-icon yellow">★</span>
              <span class="wechat-label">收藏</span>
            </button>
            <button class="wechat-row" type="button">
              <span class="wechat-icon blue">图</span>
              <span class="wechat-label">朋友圈</span>
            </button>
            <button class="wechat-row" type="button">
              <span class="wechat-icon orange">表</span>
              <span class="wechat-label">表情</span>
            </button>
          </section>
          <section class="settings-list wechat-list">
            <button class="wechat-row" type="button">
              <span class="wechat-icon gray">⚙</span>
              <span class="wechat-label">设置</span>
            </button>
          </section>
        </main>

        <section id="chatView" class="chat-view hidden">
          <main id="messageList" class="message-list"></main>

          <footer class="chat-input-bar">
            <input id="messageInput" type="text" placeholder="输入消息，和樱岛麻衣聊聊天..." maxlength="1000" />
            <button id="sendBtn" type="button">发送</button>
          </footer>
        </section>

        <nav class="bottom-tabs" aria-label="主导航">
          <button class="bottom-tab active" type="button" data-view="messages">
            <span class="tab-icon" aria-hidden="true">☰</span>
            <span>消息</span>
          </button>
          <button class="bottom-tab" type="button" data-view="contacts">
            <span class="tab-icon" aria-hidden="true">○</span>
            <span>联系人</span>
          </button>
          <button class="bottom-tab" type="button" data-view="moments">
            <span class="tab-icon" aria-hidden="true">◎</span>
            <span>朋友圈</span>
          </button>
          <button class="bottom-tab" type="button" data-view="profile">
            <span class="tab-icon" aria-hidden="true">◇</span>
            <span>我的</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
