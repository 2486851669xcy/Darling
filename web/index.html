<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DimensionMessenger Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="phone-frame">
        <header class="app-header">
          <button id="backBtn" class="back-button hidden" type="button">‹</button>
          <div class="header-copy">
            <div class="chat-title">消息</div>
            <div class="chat-subtitle">DimensionMessenger</div>
          </div>
          <button id="clearBtn" class="ghost-button hidden" type="button">清空记录</button>
        </header>

        <main id="messagesView" class="app-view active-view">
          <section class="conversation-list">
            <button id="maiConversation" class="conversation-card" type="button">
              <img class="conversation-avatar" alt="樱岛麻衣头像" />
              <span class="conversation-main">
                <span class="conversation-name">樱岛麻衣</span>
                <span id="conversationPreview" class="conversation-preview">点开和她聊天</span>
              </span>
              <span id="conversationTime" class="conversation-time"></span>
            </button>
          </section>
        </main>

        <main id="contactsView" class="app-view">
          <section class="section-title">联系人</section>
          <button id="maiContact" class="contact-row" type="button">
            <img class="contact-avatar" alt="樱岛麻衣头像" />
            <span>
              <span class="contact-name">樱岛麻衣</span>
              <span class="contact-note">恋人</span>
            </span>
          </button>
        </main>

        <main id="momentsView" class="app-view moments-view">
          <section class="moments-cover">
            <div>
              <div class="moments-title">朋友圈</div>
              <div class="moments-subtitle">今天也认真生活</div>
            </div>
          </section>
          <article class="moment-card">
            <img class="moment-avatar" alt="樱岛麻衣头像" />
            <div class="moment-body">
              <div class="moment-name">樱岛麻衣</div>
              <p>拍摄结束。回去之前买点食材，今晚大概会做得清淡一点。</p>
              <div class="moment-meta">刚刚</div>
            </div>
          </article>
          <article class="moment-card">
            <img class="moment-avatar" alt="樱岛麻衣头像" />
            <div class="moment-body">
              <div class="moment-name">樱岛麻衣</div>
              <p>天气不错。偶尔安静一点，也不坏。</p>
              <div class="moment-meta">昨天 21:14</div>
            </div>
          </article>
        </main>

        <main id="profileView" class="app-view profile-view">
          <section class="profile-card">
            <img class="profile-avatar" alt="我的头像" />
            <div>
              <div class="profile-name">我</div>
              <div class="profile-id">Dimension ID: local-user</div>
            </div>
          </section>
          <section class="settings-list">
            <button type="button">收藏</button>
            <button type="button">相册</button>
            <button type="button">表情</button>
            <button type="button">设置</button>
          </section>
        </main>

        <section id="chatView" class="chat-view hidden">
          <main id="messageList" class="message-list"></main>

          <div id="typingIndicator" class="typing-indicator hidden">
            樱岛麻衣 正在输入...
          </div>

          <footer class="chat-input-bar">
            <input id="messageInput" type="text" placeholder="输入消息，和樱岛麻衣聊聊天..." maxlength="1000" />
            <button id="sendBtn" type="button">发送</button>
          </footer>
        </section>

        <nav class="bottom-tabs" aria-label="主导航">
          <button class="bottom-tab active" type="button" data-view="messages">
            <span class="tab-icon" aria-hidden="true">☰</span>
            <span>消息</span>
          </button>
          <button class="bottom-tab" type="button" data-view="contacts">
            <span class="tab-icon" aria-hidden="true">○</span>
            <span>联系人</span>
          </button>
          <button class="bottom-tab" type="button" data-view="moments">
            <span class="tab-icon" aria-hidden="true">◎</span>
            <span>朋友圈</span>
          </button>
          <button class="bottom-tab" type="button" data-view="profile">
            <span class="tab-icon" aria-hidden="true">◇</span>
            <span>我的</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
