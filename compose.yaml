name: darling

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darling}
      POSTGRES_USER: ${POSTGRES_USER:-darling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darling_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-darling}:${POSTGRES_PASSWORD:-darling_local}@postgres:5432/${POSTGRES_DB:-darling}?sslmode=disable"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_REDIRECT_URL: "${WECHAT_REDIRECT_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
